[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/luz_verde"]

[project]
name = "luz-verde"
version = "0.1.0"
readme = "README.md"
description = "Determining safe places to cross the street using OpenStreetMap data"
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.1.4",
    "osmnx>=2.1.1",
    "tqdm>=4.70.1",
]

[project.optional-dependencies]
examples = [
    "folium>=0.20.0",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "jupytext>=1.19.5",
    "mapclassify>=2.11.0",
    "matplotlib>=3.11.2",
]

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]

[tool.jupytext]
formats = "ipynb,py:percent"
notebook_metadata_filter = "-all"
